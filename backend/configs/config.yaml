server:
  port: "8080" 

log:
  level: "info"      # 开发时可改 debug;生产必须 info 或以上
  format: "console"  # 开发用 console(彩色),生产用 json


mysql:
  host: "127.0.0.1"
  port: "3306"
  user: "root"
  password: "" # 占位，真实密码由环境变量 DB_PASSWORD 注入
  db_name: "live_stream"
  charset: "utf8mb4"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 3600 # 1 hour
  log_level: "warn"  

jwt:
  secret: "dev-secret" # 
  expires_hours: 2 # access token 有效期（小时）

redis:
  host: "127.0.0.1"
  port: "6379"
  password: "" 
  db: 0

kafka:
  brokers:
  - "localhost:9092"
  topic: "danmu"
  group_id: "danmu-db-writer"